services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://procart:procart@db:5432/procart
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: procart
      POSTGRES_PASSWORD: procart
      POSTGRES_DB: procart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procart -d procart"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: